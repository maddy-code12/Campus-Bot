<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="50%" stop-color="#4a0011" />
      <stop offset="100%" stop-color="#1f0007" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997a15" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#dropGlow)" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Shield Base -->
  <path d="M 60 52 L 140 52 C 140 95, 125 130, 100 148 C 75 130, 60 95, 60 52 Z" 
        fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Inner Shield Division -->
  <path d="M 62 54 L 100 54 L 100 145 C 80 128, 62 95, 62 54 Z" fill="#fff9e6" />
  <path d="M 100 54 L 138 54 C 138 95, 120 128, 100 145 Z" fill="#f0e6cc" />

  <!-- Engineering Cogwheel / Gear -->
  <g transform="translate(100, 80) scale(0.6)">
    <circle cx="0" cy="0" r="28" fill="#800020" />
    <!-- Gear teeth -->
    <path d="M -6 -35 L 6 -35 L 5 -25 L -5 -25 Z" fill="#d4af37" />
    <path d="M -6 35 L 6 35 L 5 25 L -5 25 Z" fill="#d4af37" />
    <path d="M -35 -6 L -35 6 L -25 5 L -25 -5 Z" fill="#d4af37" />
    <path d="M 35 -6 L 35 6 L 25 5 L 25 -5 Z" fill="#d4af37" />
    <path d="M -22 -22 L -14 -30 L -7 -23 L -15 -15 Z" fill="#d4af37" />
    <path d="M 22 22 L 14 30 L 7 23 L 15 15 Z" fill="#d4af37" />
    <path d="M -22 22 L -30 14 L -23 7 L -15 15 Z" fill="#d4af37" />
    <path d="M 22 -22 L 30 -14 L 23 -7 L 15 -15 Z" fill="#d4af37" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <circle cx="0" cy="0" r="8" fill="#800020" />
  </g>

  <!-- Open Book of Knowledge -->
  <g transform="translate(100, 118) scale(0.55)">
    <path d="M 0 0 Q -25 -10 -45 5 L -45 -18 Q -25 -30 0 -22 Q 25 -30 45 -18 L 45 5 Q 25 -10 0 0 Z" fill="#800020" stroke="#d4af37" stroke-width="2" />
    <path d="M -2 -20 L -2 2" stroke="#d4af37" stroke-width="2" />
  </g>

  <!-- Flame of Wisdom / Lamp -->
  <path d="M 100 40 C 94 48, 92 52, 97 58 C 99 60, 101 60, 103 58 C 108 52, 106 48, 100 40 Z" fill="#ff9900" />
  <path d="M 100 46 C 98 50, 97 53, 99 56 C 100 57, 101 57, 101 56 C 103 53, 102 50, 100 46 Z" fill="#ffee55" />

  <!-- Circular Text Curvature (Path) -->
  <path id="textCircle" d="M 22 100 A 78 78 0 1 1 178 100" fill="none" />
  <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="900" fill="url(#goldGrad)" letter-spacing="2.2">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      P.D.A. COLLEGE OF ENGG.
    </textPath>
  </text>

  <!-- Bottom Banner with ESTD 1958 -->
  <path d="M 45 160 Q 100 178 155 160 L 150 172 Q 100 190 50 172 Z" fill="url(#goldGrad)" />
  <text x="100" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#4a0011" text-anchor="middle" letter-spacing="1.5">
    KALABURAGI • ESTD 1958
  </text>
</svg>
