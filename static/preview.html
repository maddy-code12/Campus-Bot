<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDA Campus Bot - Glassmorphism Preview</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1b2a6b 0%, #0b1020 80%);
      font-family: "Inter", system-ui, sans-serif;
      color: #f4f6ff;
    }
    .hero {
      max-width: 600px;
      margin-top: 60px;
    }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { font-size: 15px; color: #b6bddc; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>PDA College of Engineering, Kalaburagi</h1>
    <p>Campus-Bot with Liquid Glassmorphism UI, 1st-Year AIML 2025 Scheme syllabus, timetable & missing data handlers.</p>
  </div>
  <script src="/static/widget.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        if (window.PDACampusBot) window.PDACampusBot.open();
      }, 600);
    });
  </script>
</body>
</html>
