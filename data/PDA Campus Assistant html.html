*{box-sizing:border-box}html,body{height:100%;margin:0}

header{background:var(--pri);color:var(--on);padding:11px 16px;border-bottom:4px solid var(--acc);display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.hdr-left{display:flex;gap:11px;align-items:center}
.logo{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#14203a;font-weight:800;display:grid;place-items:center;flex:none;overflow:hidden;border:2px solid var(--acc)}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
header b{display:block;font-size:1.05rem;letter-spacing:-.2px}header small{opacity:.88;font-size:.8rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:7px 14px;background:var(--card);border-bottom:1px solid var(--line);font-size:.8rem;color:var(--mut)}
.bar select,.bar input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:3px 7px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px;scroll-behavior:smooth}
.b{max-width:92%;padding:12px 15px;border-radius:15px;border-top-left-radius:4px;background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.b.me{align-self:flex-end;background:var(--pri);color:var(--on);border:0;border-top-left-radius:15px;border-top-right-radius:4px;font-weight:500}
.b a{color:var(--pri);font-weight:600;text-decoration:underline}
.tag{display:inline-block;font-size:.72rem;font-weight:700;background:var(--acc);color:#14203a;border-radius:5px;padding:2px 7px;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font:inherit;font-size:.86rem;font-weight:500;border:1.5px solid var(--pri);color:var(--pri);background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;transition:all .15s ease}
.chip:hover,.chip:focus-visible{background:var(--pri);color:var(--on);outline:0;transform:translateY(-1px)}
.ok{color:var(--ok);font-weight:700}.wn{color:var(--wn);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:.8rem;margin-top:6px}
td,th{border:1px solid var(--line);padding:5px 7px;text-align:left}
th{background:rgba(22,48,107,.07);font-weight:700}
.w{overflow-x:auto;border-radius:8px;margin-top:4px}
.ck{display:block;margin:4px 0;cursor:pointer}.pg{height:7px;border-radius:4px;background:var(--line);margin:7px 0;overflow:hidden}.pg i{display:block;height:100%;border-radius:4px;background:var(--ok);width:0;transition:width .2s}
.inp-box{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:6px}
form{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
input[type=text]{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;outline:none}
input[type=text]:focus{border-color:var(--pri)}
.send{font:inherit;font-weight:700;border:0;border-radius:999px;background:var(--pri);color:var(--on);padding:0 18px;cursor:pointer}
</style></head><body>
<header>

</div>
<div id="chat" aria-live="polite"></div>
<form id="f">
  <input type="text" id="q" placeholder="Ask a question or type a teacher’s name..." autocomplete="off">
  <button type="button" class="chip" id="mic" aria-label="Speak" style="padding:0 13px">🎤</button>
  <button class="send" id="send-btn" type="submit">Send</button>
</form>

/* ---- Chat & Voice Helpers ---- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CODE={en:"en-IN",kn:"kn-IN",hi:"hi-IN"};
let vOn=false;
function speak(t){
  try{
    if(!vOn||!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang=CODE[LG()]||"en-IN";
    window.speechSynthesis.speak(u);
  }catch(e){}
}
$("#tts-toggle").onclick=()=>{
  vOn=!vOn;
  $("#tts-toggle").textContent=vOn?"🔈 ON":"🔊";
};
function add(h,chips,me){
  const b=document.createElement("div");
  b.className="b"+(me?" me":"");
  b.innerHTML=h;
  if(chips&&chips.length){
    const c=document.createElement("div");
    c.className="chips";
    chips.forEach(x=>{
      const k=document.createElement("button");
      k.className="chip";
      k.type="button";
      k.textContent=x[0];
      k.onclick=()=>{add(esc(x[0]),0,1);x[1]()};
      c.appendChild(k);
    });
    b.appendChild(c);
  }
  chat.appendChild(b);
  chat.scrollTop=chat.scrollHeight;
  if(!me){
    const c=b.cloneNode(true);
    c.querySelector(".chips")?.remove();
    speak(c.textContent);
  }
  return b;
}

async function showMaterialItem(deptName,scheme,itemType){
  /* Check backend /api/study-materials first for any step-by-step data inserted */
  try{
    const r=await fetch(`${API_BASE}/api/study-materials?dept=${encodeURIComponent(deptName)}&scheme=${encodeURIComponent(scheme)}&resource_type=${encodeURIComponent(itemType)}`);
    if(r.ok){
      const rows=await r.json();
      if(rows&&rows.length>0){
        const html=rows.map(x=>`• <b>${esc(x.title)}</b>: ${esc(x.content)} ${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">[Open]</a>`:""}`).join("<br>");
        add(`<span class="tag">${esc(deptName)} · ${scheme} Scheme</span><br><b>${esc(itemType)}</b><br>${html}`,[["⬅ Back to Resources",()=>stuMaterial(deptName,scheme)]].concat(back()));
        return;
      }
    }
  }catch(e){}

  if(itemType==="Syllabus"){
    add(
      `<span class="tag">${esc(deptName)} · ${scheme} Scheme · Syllabus</span><br>`+
      `<b>Official Syllabus PDFs on pdacek.ac.in:</b><br>`+
      SYL.map(x=>`• ${SL("img/pdf/academics/"+x[1],x[0])} (${x[2]} Scheme)`).join("<br>")+
      `<br><small>Additional semester-wise syllabus files for ${esc(deptName)} (${scheme} Scheme) will appear here as you provide them step-by-step.</small>`,
      [["⬅ Back to Resources",()=>stuMaterial(deptName,scheme)]].concat(back())
    );
    return;
  }
  add(
    `<span class="tag">${esc(deptName)} · ${scheme} Scheme</span><br>`+
    `<b>${esc(itemType)}</b><br>${T().notUploaded}`,
    [["⬅ Back to Resources",()=>stuMaterial(deptName,scheme)]].concat(back())
  );
}

/* ---- Intelligent Question Handler (Built-in + Backend ML / AI_URL + Honest Fallback) ---- */
async function handleQuery(v){
  const l=v.toLowerCase();

  /* 1. Direct Teacher Match */
  const matchedTeacher=STAFF_LIST.find(t=>{
    const clean=t.name.toLowerCase().replace(/^(dr\.|prof\.)\s+/,"");
    const parts=clean.split(/\s+/).filter(p=>p.length>3);
    return l.includes(clean)||parts.some(p=>l.includes(p));
  });
  if(matchedTeacher&&!/fee|cutoff|intake|scholarship/.test(l)){
    loc(matchedTeacher.code);
    return;
  }

  /* 2. Query Backend /api/chat or configured AI_URL */
  const aiUrl=localStorage.getItem("pda_ai_url")||`${API_BASE}/api/chat`;
  const b=add("…");
  try{
    const res=await fetch(aiUrl,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:v,lang:LG(),ai_url:localStorage.getItem("pda_ai_url")||""})
    });
    if(res.ok){
      const data=await res.json();
      if(data.category==="not_sure_fallback"||data.confidence<0.5){
        b.innerHTML=T().notSure;
        speak(b.textContent);
        return;
      }
      const formatted=(data.lines||[data.reply]).map(line=>
        esc(line)
          .replace(/^###\s+(.*)$/,"<b>$1</b>")
          .replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")
          .replace(/`(.*?)`/g,"<code>$1</code>")
      ).join("<br>");
      b.innerHTML=formatted;
      speak(data.audio_text||b.textContent);
      return;
    }
  }catch(e){}

  /* 3. Offline Built-in Rules & Honest "Not Sure" Fallback */
  if(/admission|intake|seat|ಪ್ರವೇಶ|प्रवेश/.test(l)){b.remove();admPrograms();return}
  if(/fee|cutoff|cut-off|kcet|comedk|ಶುಲ್ಕ|फीस|शुल्क/.test(l)){b.remove();admFeesCutoffs();return}
  if(/document|certificate|ದಾಖಲೆ|दस्तावेज़/.test(l)){b.remove();ck();return}
  if(/scholarship|ssp|nsp|pragati|vidyasiri|ವಿದ್ಯಾರ್ಥಿವೇತನ|छात्रवृत्ति/.test(l)){b.remove();schPortals();return}
  if(/notice|exam|result|ಸೂಚನೆ|ಪರೀಕ್ಷೆ|सूचना|परीक्षा/.test(l)){b.remove();nt();return}
  if(/timetable|schedule|ವೇಳಾಪಟ್ಟಿ|टाइमटेबल/.test(l)){b.remove();stuTimetableMenu();return}

  b.innerHTML=T().notSure;
  speak(b.textContent);
}
